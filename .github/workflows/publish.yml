name: Publish to Modrinth
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches build version
        run: |
          BUILD_VERSION=$(grep -E '^version\s*=' build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          if [ "v${BUILD_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match build version ${BUILD_VERSION}"
            exit 1
          fi

      - name: Fetch tag message
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          {
            echo "CHANGELOG<<EOF"
            git tag -l --format='%(contents)' "${GITHUB_REF_NAME}"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - run: ./gradlew modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
